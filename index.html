<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人工作台</title>
<style>
:root{--bg:#FFF8F3;--pink:#FF9FB3;--mint:#B8E6A8;--avo:#9BCB6B;--peach:#FFE0CE;--text:#5C4B35;--border:#FFE8DE;--orange:#FF8C42;--sub:#A8927B;--water:#8FD3F4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#F1E7DE;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center}
#phone{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){body{padding:24px;background:linear-gradient(160deg,#F6E3D3,#EAD9EC)}#phone{height:min(880px,94vh);border-radius:38px;box-shadow:0 26px 70px rgba(92,75,53,.25)}}
header{padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
#ava{position:relative;width:48px;height:48px;border-radius:50%;border:2.5px solid #fff;outline:2px solid var(--pink);overflow:hidden;cursor:pointer;flex-shrink:0;background:var(--peach);display:flex;align-items:center;justify-content:center;font-size:26px}
#avaImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.hdmid{flex:1;min-width:0}
#greet{font-size:16px;font-weight:800}
#hddate{font-size:12px;color:var(--sub);margin-top:2px}
.hbtn{width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 92px}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1.5px solid var(--border);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;border:0;font-size:11px;color:var(--sub);cursor:pointer;padding:3px 0;font-family:inherit}
nav button b{display:block;font-size:20px;font-weight:normal;margin-bottom:1px}
nav button.on{color:var(--orange);font-weight:700}
.card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-top:12px}
.sect{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:15px;gap:8px}
.sect small{font-weight:normal;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .w{font-size:11px;color:var(--sub);padding:4px 0;font-weight:700}
.cal .d{position:relative;border-radius:10px;padding:5px 0 4px;cursor:pointer;font-size:13px;min-height:46px}
.cal .d.sel{background:var(--peach);outline:1.5px solid var(--pink)}
.cal .d.today{outline:1.5px dashed var(--orange)}
.cal .d small{display:block;font-size:9px;color:#e08080;line-height:1.3}
.cal .d i{display:block;font-style:normal;font-size:10px;line-height:1.3}
.monnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px;font-weight:800;font-size:15px}
.monnav button{background:none;border:0;font-size:18px;color:var(--sub);cursor:pointer;padding:2px 12px}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;resize:none}
.btn{border:0;border-radius:12px;background:var(--avo);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;cursor:pointer;font-family:inherit}
.btn.pink{background:var(--pink)}
.btn.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--border);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:5px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--border);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--sub);white-space:nowrap;font-family:inherit}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700}
.task{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--border)}
.task:last-child{border-bottom:0}
.ckb{width:20px;height:20px;border-radius:50%;border:2px solid var(--avo);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.ckb.on{background:var(--avo)}
.pri{flex-shrink:0;font-size:11px;border-radius:6px;padding:2px 6px;cursor:pointer;font-weight:700;color:#5C4B35}
.tname{flex:1;min-width:0;font-size:14px}
.done .tname{text-decoration:line-through;color:var(--sub)}
.del{background:none;border:0;color:#e0a5a5;cursor:pointer;font-size:14px;padding:2px 4px;font-family:inherit}
.pbar{height:8px;background:var(--peach);border-radius:99px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--avo));border-radius:99px;transition:width .3s}
.stat3{display:flex;gap:8px;text-align:center}
.stat3>div{flex:1;background:var(--bg);border-radius:12px;padding:8px 4px}
.stat3 b{display:block;font-size:15px}
.stat3 span{font-size:11px;color:var(--sub)}
.catbar{margin:7px 0;cursor:pointer}
.catbar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.catbar .tr{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.catbar .tr i{display:block;height:100%;border-radius:99px}
.item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed var(--border);font-size:14px}
.item:last-child{border-bottom:0}
.moods7{display:flex;justify-content:space-between}
.moods7 button{background:none;border:0;font-size:26px;cursor:pointer;padding:4px;border-radius:12px;font-family:inherit}
.moods7 button.on{background:var(--peach);outline:1.5px solid var(--pink)}
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cupit{background:var(--bg);border-radius:12px;padding:8px 2px 6px;text-align:center;cursor:pointer}
.cup{width:32px;height:40px;margin:0 auto;border:2px solid #b9d8ec;border-top-width:1.5px;border-radius:3px 3px 12px 12px;position:relative;overflow:hidden;background:#fff}
.cup i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water);transition:height .25s}
.cupit.on .cup i{height:88%}
.ck2{width:18px;height:18px;border-radius:50%;border:2px solid var(--avo);margin:6px auto 0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.cupit.on .ck2{background:var(--avo)}
.cupit .ml{font-size:10px;color:var(--sub);margin-top:3px}
.wbar{height:10px;background:var(--peach);border-radius:99px;overflow:hidden;margin-top:4px}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#bfe6fb,var(--water));transition:width .3s;border-radius:99px}
.mealh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:13px;font-weight:800}
.mealh small{color:var(--sub);font-weight:normal}
.idea{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:10px}
.idea .tt{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.idea .tx{font-size:14px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
audio{width:100%;margin-top:6px;height:36px}
.empty{color:var(--sub);font-size:13px;padding:6px 2px}
.mask{position:absolute;inset:0;background:rgba(60,45,30,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.mask.on{display:flex}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:360px;max-height:84%;overflow-y:auto;padding:18px}
.sheet h3{margin-bottom:10px}
.sheet .tx{font-size:14px;word-break:break-all}
.mrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.hide{display:none!important}
@keyframes blink{50%{opacity:.55}}
#recBtn.on{animation:blink 1s infinite}
</style>
</head>
<body>
<div id="phone">
<header>
  <div id="ava">🐱<img id="avaImg" alt=""></div>
  <div class="hdmid"><div id="greet"></div><div id="hddate"></div></div>
  <div class="hbtn" data-a="sOpen">⚙️</div>
</header>
<main id="main"></main>
<nav id="tabs"></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<input type="file" id="avaFile" accept="image/*" class="hide">
</div>
<script>
(function(){
'use strict';
var KEY='personalWorkbench_v1',state;
function blank(){return{tasks:{},ledger:[],moods:[],ideas:[],fitDays:{},fitLib:[],avatar:'',sync:{key:'',bin:''},lastWeek:'',lastDiet:''}}
function uid(){return Math.random().toString(36).slice(2,9)}
function dkey(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return (n<10?'0':'')+n}
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return '¥'+(Math.round(n*100)/100)}
function tk(){return dkey(new Date())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存失败：本地存储空间不够（可能是录音太多），删几条旧灵感再试')}}
function load(){try{state=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){state=blank()}if(!state.lastDiet)state.lastDiet=''}
function getDay(k){var fd=state.fitDays[k];if(!fd){fd={plan:[],water:[0,0,0,0,0,0,0,0],meals:[{id:uid(),name:'早餐',items:[]},{id:uid(),name:'午餐',items:[]},{id:uid(),name:'晚餐',items:[]}]};state.fitDays[k]=fd}
if(!fd.water)fd.water=[0,0,0,0,0,0,0,0];
if(!fd.meals)fd.meals=[{id:uid(),name:'早餐',items:[]},{id:uid(),name:'午餐',items:[]},{id:uid(),name:'晚餐',items:[]}];
fd.meals.forEach(function(m){if(!m.items)m.items=[]});
if(!fd.plan)fd.plan=[];
return fd}
function migrate(){
if(!state.tasks)state.tasks={};if(!state.ledger)state.ledger=[];if(!state.moods)state.moods=[];if(!state.ideas)state.ideas=[];if(!state.fitDays)state.fitDays={};if(!state.fitLib)state.fitLib=[];if(!state.sync)state.sync={key:'',bin:''};if(!state.lastWeek)state.lastWeek='';
try{if(state.fitPlan){for(var k in state.fitPlan){var arr=state.fitPlan[k]||[],ck=(state.fitChecks&&state.fitChecks[k])||[];var fd=getDay(k);fd.plan=arr.map(function(n,i){return{id:uid(),name:String(n),done:ck.indexOf(i)>=0}})}delete state.fitPlan;delete state.fitChecks}}catch(e){}
for(var k2 in state.fitDays){var fd2=state.fitDays[k2];
if(fd2.meals)fd2.meals.forEach(function(m){if(m.text!==undefined){m.items=(m.text||'').trim()?[{id:uid(),n:m.text,k:null}]:[];delete m.text}});
if(fd2.water===undefined)fd2.water=[0,0,0,0,0,0,0,0]}
if(!state.fitLib.length)state.fitLib=['俯卧撑','深蹲','平板支撑','卷腹','慢跑','跳绳','哑铃','拉伸','开合跳','引体向上'];
}
/* ---------- 基础数据 ---------- */
var GREET={dawn:['凌晨好，夜猫子该睡啦 🌙','天还没亮呢，再睡会儿 😴'],morning:['早上好，新的一天加油 ☀️','早安！今天也要元气满满 🌈','起床啦，美好的一天开始了 ✨'],noon:['中午好，记得吃午饭 🍱','午安，干饭时间到 🍚'],mid:['午安，犯困就歇一会儿 ☕'],aft:['下午好，坚持住就快收工啦 💪','下午茶时间，来点水果 🍎'],eve:['晚上好，今天过得怎么样？🌙','晚上好，记得记今天的账 💰'],night:['夜深了，早点休息 🌟','今天辛苦啦，晚安 😴']};
function pickGreet(){var h=new Date().getHours();var k=h<6?'dawn':h<11?'morning':h<13?'noon':h<15?'mid':h<18?'aft':h<22?'eve':'night';var a=GREET[k];return a[Math.floor(Math.random()*a.length)]}
var PRI=[{n:'低',c:'#B8E6A8'},{n:'中',c:'#FFD666'},{n:'高',c:'#FF9FB3'}];
var CAT_OUT=[['餐饮','🍜'],['交通','🚌'],['购物','🛍️'],['医疗','💊'],['宠物','🐾'],['日用品','🧻'],['其他','📦']];
var CAT_IN=[['工资','💰'],['兼职','💼'],['理财','📈'],['红包','🧧'],['其他','🎁']];
var BC=['#FF9FB3','#FFB37E','#FFD666','#B8E6A8','#9BCB6B','#8FD3F4','#C9A8E8'];
var MOODS=[['😀','超开心','#FFD666'],['🙂','开心','#FFE0A8'],['😌','平静','#C8E6C9'],['😐','一般','#E5E0D8'],['😔','低落','#BFD3E6'],['😢','难过','#9FC5E8'],['😡','烦躁','#FFB3B3']];
var FOODS=[['米饭',200],['馒头',120],['面条',450],['米粥',100],['包子',220],['饺子10个',420],['鸡蛋',80],['牛奶',160],['豆浆',100],['酸奶',120],['鸡胸肉',150],['鸡腿',250],['红烧肉',500],['排骨',400],['清蒸鱼',200],['虾',100],['牛排',450],['豆腐',100],['炒青菜',80],['西兰花',50],['番茄炒蛋',250],['土豆丝',120],['红薯',120],['玉米',100],['炒饭',500],['汉堡',550],['薯条',300],['披萨2块',500],['三明治',350],['沙拉',200],['火锅一顿',800],['麻辣烫',500],['螺蛳粉',550],['烤串10串',300],['蛋糕',300],['奶茶',350],['可乐',150],['咖啡',100],['苹果',80],['香蕉',90]];
var TABS=[['plan','📋','计划'],['led','💰','记账'],['mood','🌤','心情'],['idea','💡','灵感'],['fit','🏋️','健身']];
/* ---------- 视图状态 ---------- */
var tab='plan',now0=new Date();
var planY=now0.getFullYear(),planM=now0.getMonth(),planSel=dkey(now0);
var ledY=now0.getFullYear(),ledM=now0.getMonth(),ledType='out',ledCat='餐饮',ledCat2=null,ledSel=dkey(now0);
var moodY=now0.getFullYear(),moodM=now0.getMonth(),moodSel=dkey(now0);
var fitY=now0.getFullYear(),fitM=now0.getMonth(),fitSel=dkey(now0);
/* ---------- 日历 ---------- */
function calGrid(y,m,sel,cellFn){var h='<div class="cal">',w=['一','二','三','四','五','六','日'],i;for(i=0;i<7;i++)h+='<div class="w">'+w[i]+'</div>';var off=(new Date(y,m,1).getDay()+6)%7;var dim=new Date(y,m+1,0).getDate();for(i=0;i<off;i++)h+='<div class="d"></div>';for(var d=1;d<=dim;d++){var k=y+'-'+p2(m+1)+'-'+p2(d);h+=cellFn(k,d,sel===k)}return h+'</div>'}
/* ---------- 计划 ---------- */
function planCell(k,d,sel){var ts=state.tasks[k]||[];var dn=ts.filter(function(t){return t.done}).length;var ex=ts.length?'<small>'+dn+'/'+ts.length+'</small>':'';return '<div class="d'+(sel?' sel':'')+(k===tk()?' today':'')+'" data-a="pDay" data-k="'+k+'">'+d+ex+'</div>'}
function renderPlan(){
var h='<div class="monnav"><button data-a="pPrev">‹</button>'+planY+'年'+(planM+1)+'月<button data-a="pNext">›</button></div>';
h+='<div class="card">'+calGrid(planY,planM,planSel,planCell)+'</div>';
var ts=state.tasks[planSel]||[];var dn=ts.filter(function(t){return t.done}).length;
var dt=new Date(planSel+'T00:00:00');
h+='<div class="card"><div class="sect">📋 '+(dt.getMonth()+1)+'月'+dt.getDate()+'日 安排 <small>'+dn+'/'+ts.length+' 已完成</small></div>';
h+='<div class="pbar"><i style="width:'+(ts.length?dn/ts.length*100:0)+'%"></i></div>';
ts.forEach(function(t){var pr=PRI[t.pri]||PRI[1];h+='<div class="task'+(t.done?' done':'')+'"><div class="ckb'+(t.done?' on':'')+'" data-a="pTog" data-id="'+t.id+'">'+(t.done?'✓':'')+'</div><span class="pri" style="background:'+pr.c+'" data-a="pPri" data-id="'+t.id+'">'+pr.n+'</span><span class="tname">'+esc(t.name)+'</span><button class="del" data-a="pDel" data-id="'+t.id+'">✕</button></div>'});
if(!ts.length)h+='<div class="empty">这一天还没有安排，加一条吧</div>';
h+='<div class="row" style="margin-top:8px"><input id="pInp" class="inp" placeholder="要做什么？"><button class="btn" data-a="pAdd">➕</button></div>';
if(dn)h+='<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn ghost sm" data-a="pClear">🧹 清除已完成</button></div>';
h+='</div>';el('main').innerHTML=h;
}
/* ---------- 记账 ---------- */
function ledCell(k,d,sel){var s=0;state.ledger.forEach(function(e){if(e.date===k&&e.type==='out')s+=e.amount});var ex=s>0?'<small>¥'+(s>=100?Math.round(s):Math.round(s*10)/10)+'</small>':'';return '<div class="d'+(sel?' sel':'')+(k===tk()?' today':'')+'" data-a="lDay" data-k="'+k+'">'+d+ex+'</div>'}
function ledDayCard(es){var ds=es.filter(function(e){return e.date===ledSel});ds.sort(function(a,b){return b.amount-a.amount});
var h='<div class="card"><div class="sect">📄 '+ledSel.slice(5).replace('-','/')+' 明细 <small>'+ds.length+' 笔</small></div>';
if(!ds.length)h+='<div class="empty">这一天还没有记录</div>';
ds.forEach(function(e){var ic='⭐';(e.type==='in'?CAT_IN:CAT_OUT).forEach(function(c){if(c[0]===e.cat)ic=c[1]});
h+='<div class="item"><span>'+ic+' '+esc(e.cat)+'</span><span class="tname" style="color:var(--sub);font-size:12px">'+esc(e.note||'')+'</span><b style="color:'+(e.type==='in'?'#6aa84f':'#e08080')+'">'+(e.type==='in'?'+':'-')+fmt(e.amount)+'</b></div>'});
return h+'</div>'}
function ledCatCard(es,out){
var h='<div class="card"><div class="sect">📊 分类统计 <small>本月支出 '+fmt(out)+'</small></div>';
if(ledCat2){var ds=es.filter(function(e){return e.type==='out'&&e.cat===ledCat2});ds.sort(function(a,b){return b.amount-a.amount});
h+='<div class="row" style="margin-bottom:6px"><button class="btn ghost sm" data-a="lBack">← 返回分类</button><b>'+esc(ledCat2)+'</b></div>';
if(!ds.length)h+='<div class="empty">暂无记录</div>';
ds.forEach(function(e){h+='<div class="item"><span class="tname">'+esc(e.note||'记录')+'</span><small style="color:var(--sub)">'+e.date.slice(5)+'</small><b style="color:#e08080">-'+fmt(e.amount)+'</b></div>'});
}else{var sums={};es.forEach(function(e){if(e.type==='out')sums[e.cat]=(sums[e.cat]||0)+e.amount});
var ks=Object.keys(sums).sort(function(a,b){return sums[b]-sums[a]});
if(!ks.length)h+='<div class="empty">本月还没有支出</div>';
ks.forEach(function(k,i){var p=out?sums[k]/out*100:0,ic='';CAT_OUT.forEach(function(c){if(c[0]===k)ic=c[1]});
h+='<div class="catbar" data-a="lBar" data-c="'+k+'"><div class="lbl"><span>'+ic+' '+k+'</span><b>'+fmt(sums[k])+'</b></div><div class="tr"><i style="width:'+Math.max(p,4)+'%;background:'+BC[i%BC.length]+'"></i></div></div>'})}
return h+'</div>'}
function renderLed(){
var y=ledY,m=ledM,pre=y+'-'+p2(m+1);
var es=state.ledger.filter(function(e){return (e.date||'').slice(0,7)===pre});
var inc=0,out=0;es.forEach(function(e){if(e.type==='in')inc+=e.amount;else out+=e.amount});
var h='<div class="monnav"><button data-a="lPrev">‹</button>'+y+'年'+(m+1)+'月<button data-a="lNext">›</button></div>';
var cats=ledType==='out'?CAT_OUT:CAT_IN;
h+='<div class="card"><div class="sect">✏️ 记一笔 <span class="row" style="gap:4px"><button class="chip'+(ledType==='out'?' on':'')+'" data-a="lType" data-t="out">支出</button><button class="chip'+(ledType==='in'?' on':'')+'" data-a="lType" data-t="in">收入</button></span></div>';

function dietStats(){var days=0,tot=0,waterCups=0,wDays=0,maxK=0,maxD='',i;
for(i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d),fd=state.fitDays[k];
if(!fd)continue;
var kk=0;(fd.meals||[]).forEach(function(m){(m.items||[]).forEach(function(x){kk+=x.k||0})});
if(kk>0){days++;tot+=kk;if(kk>maxK){maxK=kk;maxD=k}}
var wc2=(fd.water||[]).filter(Boolean).length;
if(wc2>0){wDays++;waterCups+=wc2}}
return {days:days,avg:days?Math.round(tot/days):0,waterPct:wDays?Math.round(waterCups/wDays/8*100):0,wDays:wDays,maxK:maxK,maxD:maxD}}

txt='记了 '+s.days+' 天三餐，日均约 '+s.avg+' 千卡，'+judge;
if(s.maxK>=2800)txt+=' 其中 '+s.maxD.slice(5).replace('-','/')+' 那天吃到 '+s.maxK+' 千卡，偶尔放纵没关系，别有负担 😋'}

fd.plan=(pd.plan||[]).map(function(x){return {id:uid(),name:x.name,done:false}});
fd.meals=(pd.meals||[]).map(function(m){return {id:m.id,name:m.name,items:(m.items||[]).map(function(x){return {id:uid(),n:x.n,k:x.k}})}});
fd.water=[0,0,0,0,0,0,0,0];save();render();alert('已复制上一天的安排（打卡和水杯已重置）')},
mealAdd:function(t){var mi=+t.dataset.mi,nm=el('mn'+mi).value.trim();if(!nm)return;
var kv=el('mk'+mi).value.trim(),k=kv?(parseFloat(kv)||0):null;
if(k===null){FOODS.forEach(function(f){if(f[0]===nm&&k===null)k=f[1]})}
getDay(fitSel).meals[mi].items.push({id:uid(),n:nm,k:k});save();render()},
mealDel:function(t){var fd=getDay(fitSel);fd.meals[+t.dataset.mi].items=fd.meals[+t.dataset.mi].items.filter(function(x){return x.id!==t.dataset.id});save();render()},
foodQ:function(t){var mi=+t.dataset.mi,f=null;FOODS.forEach(function(x){if(x[0]===t.dataset.f)f=x});
if(f)state.fitDays[fitSel].meals[mi].items.push({id:uid(),n:f[0],k:f[1]});save();render()},
diet:function(){openSheet(dietReportHtml(true))},
sOpen:function(){openSheet(settingsHtml())},
sClose:function(){closeSheet()},
sAva:function(){el('avaFile').click()},
sPush:function(){pushCloud()},
sPull:function(){pullCloud()}
};
/* ---------- 事件绑定 ---------- */
el('main').addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var f=ACT[t.dataset.a];if(f)f(t,e)});
el('sheet').addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var f=ACT[t.dataset.a];if(f)f(t,e)});
el('main').addEventListener('change',function(e){if(e.target.id==='mNote'){var old=null;state.moods.forEach(function(x){if(x.date===moodSel)old=x});
if(old){old.note=e.target.value;save()}else{state.moods.push({id:uid(),date:moodSel,m:3,note:e.target.value});save()}}});
el('mask').addEventListener('click',function(e){if(e.target===el('mask'))closeSheet()});
el('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)});
el('ava').addEventListener('click',function(){el('avaFile').click()});
el('avaFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){var img=new Image();
img.onload=function(){var c=document.createElement('canvas');c.width=c.height=240;var x=c.getContext('2d');
var s=Math.min(img.width,img.height);
x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);
state.avatar=c.toDataURL('image/jpeg',0.85);initAvatar();save()};
img.src=r.result};
r.readAsDataURL(f);e.target.value=''});
/* ---------- 启动 ---------- */
function go(t){tab=t;render();var h='';TABS.forEach(function(x){h+='<button class="'+(x[0]===t?'on':'')+'" data-t="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>'});el('tabs').innerHTML=h}
load();migrate();save();
initAvatar();
el('greet').textContent=pickGreet();
el('hddate').textContent='今天是 '+tk()+' '+['周日','周一','周二','周三','周四','周五','周六'][new Date().getDay()];
go('plan');
setTimeout(mondayCard,600);
})();
</script>
